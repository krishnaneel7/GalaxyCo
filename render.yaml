services:
  - type: web
    name: galaxyco
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn hitup.wsgi:application"

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: galaxyco-db
          property: connectionString

databases:
  - name: galaxyco-db
    databaseName: galaxyco
    user: galaxyco