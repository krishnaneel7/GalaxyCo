<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GalaxyCo - Owner Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #111827,
                #1e3a8a
            );
        }

        .login-card {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .owner-badge {
            text-align: center;
            margin-bottom: 25px;
            color: #475569;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .customer-login {
            text-align: center;
            margin-top: 22px;
        }

        .customer-login a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        GalaxyCo
    </div>

    <div class="subtitle">
        Owner Dashboard
    </div>

    <div class="owner-badge">
        🔐 Authorized Owner Access
    </div>

    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>
            Owner Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter owner username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter owner password"
            required
        >

        <button type="submit">
            Owner Login
        </button>

    </form>

    <div class="customer-login">
        <a href="{% url 'customer_login' %}">
            ← Customer Login
        </a>
    </div>

</div>

</body>
</html>
