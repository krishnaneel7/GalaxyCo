```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GalaxyCo | Customer Registration</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e3a8a
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .page-container {

            width: 100%;

            max-width: 460px;

        }


        /* HOME */

        .home-container {

            margin-bottom: 20px;

        }


        .home-btn {

            display: inline-block;

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

        }


        .home-btn:hover {

            text-decoration: underline;

        }


        /* CARD */

        .card {

            background: white;

            border-radius: 20px;

            padding: 38px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

        }


        /* LOGO */

        .logo {

            text-align: center;

            margin-bottom: 22px;

        }


        .logo-icon {

            width: 62px;

            height: 62px;

            margin: 0 auto 10px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5e9
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            font-weight: bold;

        }


        .logo h1 {

            color: #0f172a;

            font-size: 29px;

            margin-bottom: 5px;

        }


        .logo p {

            color: #64748b;

            font-size: 14px;

        }


        /* TITLE */

        .form-title {

            text-align: center;

            color: #1e293b;

            font-size: 22px;

            margin-bottom: 24px;

        }


        /* FORM */

        .form-group {

            margin-bottom: 17px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

        }


        .form-control {

            width: 100%;

            height: 48px;

            border:
                1px solid #cbd5e1;

            border-radius: 10px;

            padding: 0 14px;

            font-size: 15px;

            outline: none;

        }


        .form-control:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,0.12);

        }


        /* PASSWORD */

        .password-wrapper {

            position: relative;

        }


        .password-wrapper
        .form-control {

            padding-right: 75px;

        }


        .toggle-password {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #2563eb;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            padding: 5px;

        }


        .toggle-password:hover {

            color: #1d4ed8;

        }


        /* MESSAGE */

        .message {

            padding: 12px 14px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 14px;

            background: #fee2e2;

            color: #991b1b;

            border:
                1px solid #fecaca;

        }


        .success-message {

            background: #dcfce7;

            color: #166534;

            border-color: #bbf7d0;

        }


        /* REGISTER */

        .register-btn {

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

        }


        .register-btn:hover {

            box-shadow:
                0 8px 20px
                rgba(37,99,235,0.3);

        }


        /* LOGIN */

        .login-link {

            text-align: center;

            margin-top: 21px;

            color: #64748b;

            font-size: 14px;

        }


        .login-link a {

            color: #2563eb;

            text-decoration: none;

            font-weight: 700;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        /* OWNER */

        .owner-link {

            text-align: center;

            margin-top: 18px;

            padding-top: 17px;

            border-top:
                1px solid #e2e8f0;

        }


        .owner-link a {

            color: #475569;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

        }


        .owner-link a:hover {

            color: #2563eb;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 18px;

            color:
                rgba(255,255,255,0.7);

            font-size: 12px;

        }


        @media (max-width: 480px) {

            .card {

                padding: 28px 22px;

            }


            .logo h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


<div class="page-container">


    <!-- HOME BUTTON -->

    <div class="home-container">

        <a
            href="{% url 'customer_login' %}"
            class="home-btn"
        >
            ← Home
        </a>

    </div>


    <div class="card">


        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                G
            </div>

            <h1>
                GalaxyCo
            </h1>

            <p>
                Antenna Solutions
            </p>

        </div>


        <h2 class="form-title">
            Create Customer Account
        </h2>


        <!-- MESSAGES -->

        {% if messages %}

            {% for message in messages %}

                <div class="message
                    {% if message.tags == 'success' %}
                        success-message
                    {% endif %}
                ">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <!-- REGISTER FORM -->

        <form
            method="POST"
            action="{% url 'customer_register' %}"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        name="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword(
                            'registerPassword',
                            this
                        )"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        name="confirm_password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword(
                            'confirmPassword',
                            this
                        )"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


        </form>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="{% url 'customer_login' %}">
                Login
            </a>

        </div>


        <!-- OWNER -->

        <div class="owner-link">

            <a href="{% url 'owner_login' %}">
                Owner Login
            </a>

        </div>


    </div>


    <div class="footer">

        © 2026 GalaxyCo. All rights reserved.

    </div>


</div>


<script>

function togglePassword(inputId, button) {

    const passwordInput =
        document.getElementById(inputId);


    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        button.textContent = "Hide";

    }

    else {

        passwordInput.type = "password";

        button.textContent = "Show";

    }

}

</script>


</body>

</html>
```
